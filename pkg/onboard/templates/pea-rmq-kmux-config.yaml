kmux:
  sink:
    stream: rabbitmq
  source:
    stream: rabbitmq
  security: spire

spire:
  spiffeID:
    format: "spiffe://<domainName>/<WSID>/<ClusterID>/<componentName>"
  
  suffixSkipSet:
    - ".sock"
    - ".socket"

rabbitmq:
  server: {{.RMQServer}}
  username: {{.RMQUsername}}
  password: {{.RMQPassword}}
  exchange:
    name: "agents" 
    type: "direct"
    durable: true
    auto-delete: true
  queue:
    name: ""
    durable: true
    auto-delete: true
  debug: false
  consumer-tag: {{.ConsumerTag}}
