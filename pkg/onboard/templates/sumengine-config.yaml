watcher:
  kubearmor:
    enabled: true
    event-type:
      logs: true
      alerts: true
    relay:
      enabled: true
      {{- if .WorkerNode }}
      name: kubearmor
      url: {{.KubeArmorAddr}}
      port: {{.KubeArmorPort}}
      {{- else }}
      name: relay-1
      url: {{.RelayServerAddr}}
      port: {{.RelayServerPort}}
      {{- end }}

summary-engine:
  kubearmor:
    enabled: true
    cron-interval: "0h05m00s"
    threshold: 10000
    file-aggregation: true
    exclude-events:
      operation:
        process: {{.ProcessOperation}}
        file: {{.FileOperation}}
        network: {{.NetworkOperation}}
  topic:
    summary-event: "summary-v2"
  exclude-namespaces:
    kubearmor: true
  k8s:
    enable: false
