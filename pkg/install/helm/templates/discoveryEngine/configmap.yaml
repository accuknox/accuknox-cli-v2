apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-engine-sumengine
  namespace: {{ .Values.namespace | default "accuknox-agents" }}
  labels:
    app: discovery-engine
data:
  app.yaml: |-
    {{ toYaml .Values.discoveryEngine.summaryEngine.appConfig | nindent 4 }}
  kmux.yaml: |-
    {{ toYaml .Values.discoveryEngine.summaryEngine.kmuxConfig | nindent 4 }}
    
