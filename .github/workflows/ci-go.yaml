name: ci-go

on:
  push:
    branches: [sa-test]
  pull_request:
    branches: [sa-test]

jobs:

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Check gofmt
        run: make gofmt

      - name: Run Gosec Security Scanner
        run: make gosec

      - name: Run Revive Action by pulling pre-built imag
        uses: morphy2k/revive-action@v2
        with:
          path: "./..."

  go-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"
          
          
      - name: Build knoxctl
        run: |
          echo "machine github.com login sanjay-ba password ${{ secrets.SA-GT }}" > ~/.netrc
          make

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"
          
        
      - name: Run unit tests
        run: |
          echo "machine github.com login sanjay-ba password ${{ secrets.SA-GT }}" > ~/.netrc
          make test
