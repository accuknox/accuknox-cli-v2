name: ci-go

on:
  push:
    branches: [sa-test]
  pull_request:
    branches: [sa-test]

jobs:

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Check gofmt
        run: make gofmt

      - name: Run Gosec Security Scanner
        run: make gosec

      - name: Run Revive Action by pulling pre-built imag
        uses: morphy2k/revive-action@v2
        with:
          path: "./..."

  go-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"
          
      - name: Create SSH directory
        run: mkdir -p $HOME/.ssh
  
      - name: Configure SSH
        run: echo "${{ secrets.GIT_KEY }}" > $HOME/.ssh/id_rsa && chmod 600 $HOME/.ssh/id_rsa

      - name: Build knoxctl
        run: |
          make

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Create SSH directory
        run: mkdir -p $HOME/.ssh
  
      - name: Configure SSH
        run: echo "${{ secrets.GIT_KEY }}" > $HOME/.ssh/id_rsa && chmod 600 $HOME/.ssh/id_rsa

      - name: Run unit tests
        run: |
          make test
