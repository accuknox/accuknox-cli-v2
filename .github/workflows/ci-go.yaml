name: ci-go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  go-validate:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/accuknox/*
      GH_ACCESS_TOKEN: ${{ secrets.AK_PAT_REPO_SCOPE }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Setup access for private go modules
        run: |
          git config --global url."https://${GH_ACCESS_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Check gofmt
        run: make gofmt

      - name: Run Gosec Security Scanner
        run: make gosec

      - name: Run Revive Action by pulling pre-built imag
        uses: morphy2k/revive-action@v2
        with:
          path: "./..."

  go-build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/accuknox/*
      GH_ACCESS_TOKEN: ${{ secrets.AK_PAT_REPO_SCOPE }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Setup access for private go modules
        run: |
          git config --global url."https://${GH_ACCESS_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Build knoxctl
        run: make

  unit-tests:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/accuknox/*
      GH_ACCESS_TOKEN: ${{ secrets.AK_PAT_REPO_SCOPE }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: "v1.20"

      - name: Setup access for private go modules
        run: |
          git config --global url."https://${GH_ACCESS_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Run unit tests
        run: make test