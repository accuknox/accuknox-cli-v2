name: Release knoxctl

on:
  workflow_dispatch:
  push:
    branches:
      - tejas-patch-1  
    tags:
      - '*'

permissions:
  contents: write
  id-token: write

jobs:
  knoxctl-release:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/accuknox/
      GH_ACCESS_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
      GIT_KEY: ${{ secrets.GIT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Verify Cosign version  
        run: cosign version

      - name: Setup access for private go modules
        env:
          GOPRIVATE: github.com/accuknox/*
          USER: accuknox-user
          TOKEN: ${{ secrets.GH_ORG_TOKEN }}
        run: |
          git config --global url."https://${USER}:${TOKEN}@github.com".insteadOf "https://github.com"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Tag Name  
        id: get_tag
        run: echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Create release of knoxctl-website repo
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.get_tag.outputs.TAG_NAME }}"
          body: "Release ${{ steps.get_tag.outputs.TAG_NAME }} for knoxctl a.k.a accuknox-cli."
          repository: accuknox/knoxctl-website
          token: ${{ secrets.GH_ORG_TOKEN }}
          make_latest: false
          files: |
            dist/*.tar.gz
            dist/*.txt
            dist/*.bundle    
            dist/*.sig
            pkg/common/release.json
